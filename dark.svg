<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <!-- Updated for a sharp, solid scanline -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,212,255,0)"/>
      <stop offset="90%" stop-color="rgba(0,212,255,0.1)"/>
      <stop offset="98%" stop-color="rgba(0,212,255,0.8)"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="leftRevealClip">
      <rect x="0" y="48" width="300" height="0">
        <animate attributeName="height" from="0" to="420" dur="2.55s" begin="0.2s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="infoRevealClip">
      <rect x="300" y="48" width="550" height="0">
        <animate attributeName="height" from="0" to="420" dur="2.55s" begin="0.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="dataClip">
      <rect x="16" y="78" width="270" height="380"/>
    </clipPath>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes dataScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-200px); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes recording {
      0%, 100% { fill: #FF4444; opacity: 1; }
      50% { fill: #FF4444; opacity: 0.3; }
    }
  </style>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="860" height="480" rx="12" fill="#0A0E17"/>

  <!-- ═══ TITLE BAR ═══ -->
  <rect width="860" height="36" rx="12" fill="#141B2D"/>
  <rect y="24" width="860" height="12" fill="#141B2D"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="6" fill="#28C840"/>
  <text x="430" y="22" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8B949E">ayush@analyst ~ % ./profile.sh --live</text>
  <circle cx="815" cy="18" r="5" fill="#FF4444" style="animation: recording 2s infinite;"/>
  <text x="798" y="22" text-anchor="end" font-family="monospace" font-size="9" fill="#FF4444" font-weight="bold">● LIVE</text>

