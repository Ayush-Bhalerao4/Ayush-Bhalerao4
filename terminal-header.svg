<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,212,255,0)" />
      <stop offset="50%" stop-color="rgba(0,212,255,0.08)" />
      <stop offset="100%" stop-color="rgba(0,212,255,0)" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-480px); }
      100% { transform: translateY(480px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes fadeIn1 { 0%, 8% { opacity: 0; } 10% { opacity: 1; } }
    @keyframes fadeIn2 { 0%, 13% { opacity: 0; } 15% { opacity: 1; } }
    @keyframes fadeIn3 { 0%, 18% { opacity: 0; } 20% { opacity: 1; } }
    @keyframes fadeIn4 { 0%, 23% { opacity: 0; } 25% { opacity: 1; } }
    @keyframes fadeIn5 { 0%, 28% { opacity: 0; } 30% { opacity: 1; } }
    @keyframes fadeIn6 { 0%, 33% { opacity: 0; } 35% { opacity: 1; } }
    @keyframes fadeIn7 { 0%, 38% { opacity: 0; } 40% { opacity: 1; } }
    @keyframes fadeIn8 { 0%, 43% { opacity: 0; } 45% { opacity: 1; } }
    @keyframes fadeIn9 { 0%, 48% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes fadeIn10 { 0%, 53% { opacity: 0; } 55% { opacity: 1; } }
    @keyframes fadeIn11 { 0%, 58% { opacity: 0; } 60% { opacity: 1; } }
    @keyframes fadeIn12 { 0%, 63% { opacity: 0; } 65% { opacity: 1; } }
    @keyframes fadeIn13 { 0%, 68% { opacity: 0; } 70% { opacity: 1; } }
    @keyframes fadeIn14 { 0%, 73% { opacity: 0; } 75% { opacity: 1; } }
    @keyframes fadeIn15 { 0%, 78% { opacity: 0; } 80% { opacity: 1; } }
    @keyframes fadeInContact { 0%, 82% { opacity: 0; } 85% { opacity: 1; } }
    @keyframes fadeInStats { 0%, 88% { opacity: 0; } 92% { opacity: 1; } }
    @keyframes dataScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-200px); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes recording {
      0%, 100% { fill: #FF4444; opacity: 1; }
      50% { fill: #FF4444; opacity: 0.3; }
    }
    .line1 { animation: fadeIn1 6s ease forwards; opacity: 0; }
    .line2 { animation: fadeIn2 6s ease forwards; opacity: 0; }
    .line3 { animation: fadeIn3 6s ease forwards; opacity: 0; }
    .line4 { animation: fadeIn4 6s ease forwards; opacity: 0; }
    .line5 { animation: fadeIn5 6s ease forwards; opacity: 0; }
    .line6 { animation: fadeIn6 6s ease forwards; opacity: 0; }
    .line7 { animation: fadeIn7 6s ease forwards; opacity: 0; }
    .line8 { animation: fadeIn8 6s ease forwards; opacity: 0; }
    .line9 { animation: fadeIn9 6s ease forwards; opacity: 0; }
    .line10 { animation: fadeIn10 6s ease forwards; opacity: 0; }
    .line11 { animation: fadeIn11 6s ease forwards; opacity: 0; }
    .line12 { animation: fadeIn12 6s ease forwards; opacity: 0; }
    .line13 { animation: fadeIn13 6s ease forwards; opacity: 0; }
    .line14 { animation: fadeIn14 6s ease forwards; opacity: 0; }
    .line15 { animation: fadeIn15 6s ease forwards; opacity: 0; }
    .lineContact { animation: fadeInContact 6s ease forwards; opacity: 0; }
    .lineStats { animation: fadeInStats 6s ease forwards; opacity: 0; }
  </style>

